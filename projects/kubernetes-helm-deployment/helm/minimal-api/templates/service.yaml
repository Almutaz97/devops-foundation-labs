apiVersion: v1
kind: Service
metadata:
  name: {{ include "minimal-api.fullname" . }}
  labels:
    {{- include "minimal-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "minimal-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: application
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
