name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/minimal-devops-workload-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
      
      - name: Build Docker image
        run: |
          docker build \
            --tag minimal-devops-workload-api:ci \
            .
      
      - name: Smoke test Docker container
        run: |
          docker rm -f minimal-api-smoke 2>/dev/null || true

          docker run -d \
            --name minimal-api-smoke \
            -p 8000:8000 \
            minimal-devops-workload-api:ci

          sleep 3

          curl --fail --show-error --silent http://localhost:8000/health

          docker rm -f minimal-api-smoke


