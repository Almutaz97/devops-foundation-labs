name: CI

permissions:
  contents: read
  packages: write

on:
  push:
  pull_request:
  workflow_dispatch:



jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: minimal-devops-workload-api

    defaults:
      run:
        working-directory: projects/minimal-devops-workload-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Docker image reference
        run: |
          IMAGE_OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_BASE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          IMAGE_REF="${IMAGE_BASE}:${GITHUB_SHA}"

          echo "IMAGE_BASE=${IMAGE_BASE}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"

          echo "Docker image: ${IMAGE_REF}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
      
      - name: Build Docker image
        run: |
          docker build \
            --tag "${IMAGE_REF}" \
            .
      
      - name: Smoke test Docker container
        run: |
          docker rm -f minimal-api-smoke 2>/dev/null || true
          trap 'docker rm -f minimal-api-smoke 2>/dev/null || true' EXIT

          docker run -d \
            --name minimal-api-smoke \
            -p 8000:8000 \
            "${IMAGE_REF}"

          for i in {1..10}; do
            if curl --fail --show-error --silent http://localhost:8000/health; then
              echo "Smoke test passed"
              exit 0
            fi

            echo "Waiting for application to become healthy..."
            sleep 1
          done

          echo "Smoke test failed. Container logs:"
          docker logs minimal-api-smoke
          exit 1
      
      - name: Add release Docker tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          RELEASE_IMAGE_REF="${IMAGE_BASE}:${GITHUB_REF_NAME}"

          docker tag "${IMAGE_REF}" "${RELEASE_IMAGE_REF}"

          echo "RELEASE_IMAGE_REF=${RELEASE_IMAGE_REF}" >> "$GITHUB_ENV"
          echo "Release image: ${RELEASE_IMAGE_REF}"


      - name: Login to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${REGISTRY}" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "${IMAGE_REF}"

      - name: Push release Docker tag to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push "${RELEASE_IMAGE_REF}"
