name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: minimal-devops-workload-api
      IMAGE_TAG: ${{ github.sha }}

    defaults:
      run:
        working-directory: projects/minimal-devops-workload-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
      
      - name: Build Docker image
        run: |
          docker build \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            .
      
      - name: Smoke test Docker container
        run: |
          docker rm -f minimal-api-smoke 2>/dev/null || true
          trap 'docker rm -f minimal-api-smoke 2>/dev/null || true' EXIT

          docker run -d \
            --name minimal-api-smoke \
            -p 8000:8000 \
            "${IMAGE_NAME}:${IMAGE_TAG}"

          for i in {1..10}; do
            if curl --fail --show-error --silent http://localhost:8000/health; then
              echo "Smoke test passed"
              exit 0
            fi

            echo "Waiting for application to become healthy..."
            sleep 1
          done

          echo "Smoke test failed. Container logs:"
          docker logs minimal-api-smoke
          exit 1
      

